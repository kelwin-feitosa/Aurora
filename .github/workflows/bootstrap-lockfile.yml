# Temporary bootstrap: generate npm's authoritative lockfile using npm registry metadata.
# This workflow only runs on the dedicated fix branch and will be removed.
name: Bootstrap npm lockfile (temporary)
on:
  push:
    branches: [fix/ci-lockfile-2026-11]
    paths: ['.github/workflows/bootstrap-lockfile.yml']
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'kelwin-feitosa/Aurora'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/ci-lockfile-2026-11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate reproducible dependency lock without installing packages
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm npm clean installation works
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(deps): commit reproducible npm lockfile"
          git push origin HEAD:fix/ci-lockfile-2026-11
