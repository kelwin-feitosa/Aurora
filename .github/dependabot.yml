# Dependabot only opens PRs; it does not deploy or merge updates.
# npm dependency updates are intentionally deferred: the main branch lacks
# package-lock.json while the CI uses npm ci, which requires a lockfile.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      routine-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
